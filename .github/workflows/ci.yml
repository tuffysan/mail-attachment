name: Mail Attachment Hub CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend / Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Backend unit gate
        run: ./scripts/ci/backend-unit.sh

  frontend:
    name: Frontend / TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend build gate
        run: ./scripts/ci/frontend-build.sh

  release-gate:
    name: Installer / Release Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Release static gate
        run: ./scripts/ci/release-gate.sh

  docker-integration:
    name: Docker Integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - backend
      - frontend
      - release-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run full Docker integration
        run: ./scripts/ci/docker-integration.sh

      - name: Show Docker status on failure
        if: failure()
        run: |
          docker compose --env-file .env -f compose.yml ps || true
          docker compose --env-file .env -f compose.yml logs --no-color --tail=300 || true

  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - backend
      - frontend
      - release-gate
      - docker-integration

    steps:
      - name: Require all gates
        shell: bash
        run: |
          test "${{ needs.backend.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.release-gate.result }}" = "success"
          test "${{ needs.docker-integration.result }}" = "success"
          echo "All Mail Attachment Hub CI gates passed."
