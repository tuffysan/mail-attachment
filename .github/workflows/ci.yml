name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static checks
        run: make check
      - name: Create test environment
        run: make init
      - name: Validate Compose
        run: docker compose --env-file .env -f compose.yml config --quiet
      - name: Start dependencies
        run: make up
      - name: Show status
        run: make ps
      - name: Stop dependencies
        if: always()
        run: docker compose --env-file .env -f compose.yml down --volumes
