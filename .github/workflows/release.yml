name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check
      - run: make init
      - run: make test
      - run: zip -r mail-attachment-hub-${GITHUB_REF_NAME}.zip . -x '.git/*' '.env'
      - uses: softprops/action-gh-release@v2
        with:
          files: mail-attachment-hub-${{ github.ref_name }}.zip
          generate_release_notes: true
