name: ${COMPOSE_PROJECT_NAME:-mail-attachment-hub}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mailhub}
      POSTGRES_USER: ${POSTGRES_USER:-mailhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - mailhub_internal
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - mailhub_internal
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      CORRELATION_ID_HEADER: ${CORRELATION_ID_HEADER:-X-Correlation-ID}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      REQUEST_LOG_EXCLUDED_PATHS: ${REQUEST_LOG_EXCLUDED_PATHS:-/health/live,/health/ready}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mailhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mailhub}
      REDIS_URL: redis://redis:6379/0
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator}
      IMAP_TIMEOUT_SECONDS: ${IMAP_TIMEOUT_SECONDS:-15}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      SYNC_RETRY_ATTEMPTS: ${SYNC_RETRY_ATTEMPTS:-3}
      SYNC_RETRY_DELAY_SECONDS: ${SYNC_RETRY_DELAY_SECONDS:-10}
      ATTACHMENT_DATA_DIR: /data/attachments
      EXTRACT_ZIP_ATTACHMENTS: ${EXTRACT_ZIP_ATTACHMENTS:-true}
      MAX_ZIP_FILES: ${MAX_ZIP_FILES:-100}
      MAX_ZIP_EXPANDED_BYTES: ${MAX_ZIP_EXPANDED_BYTES:-104857600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      STORAGE_RETRY_ATTEMPTS: ${STORAGE_RETRY_ATTEMPTS:-3}
      TZ: ${TZ:-UTC}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    volumes:
      - attachment_data:/data/attachments
      - routed_data:/data/routed
    networks:
      - mailhub_internal
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["python", "-m", "mailhub.worker"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      REQUEST_ID_HEADER: ${REQUEST_ID_HEADER:-X-Request-ID}
      CORRELATION_ID_HEADER: ${CORRELATION_ID_HEADER:-X-Correlation-ID}
      SECURITY_HEADERS_ENABLED: ${SECURITY_HEADERS_ENABLED:-true}
      REQUEST_LOG_EXCLUDED_PATHS: ${REQUEST_LOG_EXCLUDED_PATHS:-/health/live,/health/ready}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mailhub}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mailhub}
      REDIS_URL: redis://redis:6379/0
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      IMAP_TIMEOUT_SECONDS: ${IMAP_TIMEOUT_SECONDS:-15}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-300}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-100}
      SYNC_RETRY_ATTEMPTS: ${SYNC_RETRY_ATTEMPTS:-3}
      SYNC_RETRY_DELAY_SECONDS: ${SYNC_RETRY_DELAY_SECONDS:-10}
      ATTACHMENT_DATA_DIR: /data/attachments
      EXTRACT_ZIP_ATTACHMENTS: ${EXTRACT_ZIP_ATTACHMENTS:-true}
      MAX_ZIP_FILES: ${MAX_ZIP_FILES:-100}
      MAX_ZIP_EXPANDED_BYTES: ${MAX_ZIP_EXPANDED_BYTES:-104857600}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      STORAGE_RETRY_ATTEMPTS: ${STORAGE_RETRY_ATTEMPTS:-3}
      TZ: ${TZ:-UTC}
    volumes:
      - attachment_data:/data/attachments
      - routed_data:/data/routed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - mailhub_internal
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - mailhub_internal
    security_opt:
      - no-new-privileges:true

networks:
  mailhub_internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  attachment_data:
  routed_data:
