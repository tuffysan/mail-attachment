[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "mail-attachment-hub-backend"
version = "1.0.0"
description = "Backend API for Mail Attachment Hub"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mail Attachment Hub contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "email-validator>=2.2,<3",
  "cryptography>=43,<46",
  "pwdlib[argon2]>=0.2,<1",
  "PyJWT>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5.2,<6",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mailhub"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
